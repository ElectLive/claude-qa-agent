---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.qa.example.com
spec:
  group: qa.example.com
  scope: Namespaced
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - size
            - image
            x-kubernetes-validations:
            - rule: '!has(self.maxReplicas) || self.maxReplicas >= self.size'
              message: maxReplicas must be >= size
            properties:
              size:
                type: integer
                minimum: 1
                maximum: 100
              maxReplicas:
                type: integer
              tier:
                type: string
                enum:
                - bronze
                - silver
                - gold
                default: silver
              image:
                type: string
                pattern: ^https://
              owner:
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: owner is immutable
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
