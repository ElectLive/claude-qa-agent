# Self-test fixture for the chainsaw-test-writer templates (scripts/chainsaw-selftest.sh).
# A made-up Widget CRD that exercises every rule kind the templates cover: required fields,
# bounds, enum + default, pattern, a CEL rule, an immutable field, the status subresource,
# an admission policy that denies and one that warns, and a read-only ClusterRole.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.qa.example.com
spec:
  group: qa.example.com
  scope: Namespaced
  names: {kind: Widget, listKind: WidgetList, plural: widgets, singular: widget}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [size, image]
              x-kubernetes-validations:
                - rule: "!has(self.maxReplicas) || self.maxReplicas >= self.size"
                  message: maxReplicas must be >= size
              properties:
                size: {type: integer, minimum: 1, maximum: 100}
                maxReplicas: {type: integer}
                tier: {type: string, enum: [bronze, silver, gold], default: silver}
                image: {type: string, pattern: '^https://'}
                owner:
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: owner is immutable
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: widget-size-cap
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [qa.example.com]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [widgets]
  validations:
    - expression: object.spec.size <= 50
      message: size above 50 needs a capacity review
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: widget-size-cap
spec:
  policyName: widget-size-cap
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: widget-bronze-deprecated
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [qa.example.com]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [widgets]
  validations:
    - expression: object.spec.tier != 'bronze'
      message: tier bronze is deprecated, use silver
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: widget-bronze-deprecated
spec:
  policyName: widget-bronze-deprecated
  validationActions: [Warn]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: widget-viewer
rules:
  - apiGroups: [qa.example.com]
    resources: [widgets]
    verbs: [get, list, watch]
